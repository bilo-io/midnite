name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Phase 78 Theme B — decide which packages this push/PR touches.
  changes:
    uses: ./.github/workflows/affected.yml

  ci:
    needs: changes
    # PRs: skip the whole runner when no package is affected (e.g. a docs/*.md-only
    # or todo/ change). `ci-gate` below reports green for the skip so the PR
    # stays mergeable.
    #
    # Pushes to `main` ALWAYS boot, whatever detection says, and always run the
    # full suite (see the two run steps below). `main` is the branch every release
    # is cut from — it must never be able to sit red behind a green badge.
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # moon needs history to detect affected projects against the base.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install Playwright chromium (Storybook stories run as browser tests in web:test)
        run: pnpm exec playwright install --with-deps chromium

      # PRs stay affected-scoped for speed, but with `--include-relations`:
      # without it moon decides affectedness from changed files against each
      # TASK's own `inputs` globs, so a change confined to `packages/shared`
      # never reaches `web:test` (inputs: app/components/hooks) and web's suite
      # is skipped even though web consumes shared. That is exactly how a shared
      # schema change (fc66e096) left `accent-builder.test.tsx` failing on `main`
      # unnoticed. `--include-relations` walks the project graph instead, so a
      # dependency's change pulls in its dependents' tasks.
      - name: moon ci (affected + dependents — pull request)
        if: github.event_name == 'pull_request'
        run: moon ci --include-relations

      # `main`: the full suite, no affected filtering and no cache reuse. `--force`
      # is what makes this a genuine verification rather than a re-report — a cached
      # PASS from a prior run can otherwise stand in for a task that would now fail.
      - name: moon ci (full suite — push to main)
        if: github.event_name != 'pull_request'
        run: moon ci --force

  # Phase 78 Theme C — the single required status check. Always runs and
  # aggregates: passes when `ci` succeeded OR was skipped (nothing affected),
  # fails on a real ci failure/cancel or a broken `changes` detection. Point
  # branch protection at THIS job, not `ci` (see docs/CICD.md).
  ci-gate:
    needs: [changes, ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI result
        run: |
          changes_res="${{ needs.changes.result }}"
          ci_res="${{ needs.ci.result }}"
          echo "changes: $changes_res · ci: $ci_res"
          if [ "$changes_res" != "success" ]; then
            echo "::error::affected-detection did not succeed ($changes_res)"
            exit 1
          fi
          if [ "$ci_res" = "success" ] || [ "$ci_res" = "skipped" ]; then
            echo "CI gate passed (ci: $ci_res)."
            exit 0
          fi
          echo "::error::CI gate failed (ci: $ci_res)"
          exit 1
