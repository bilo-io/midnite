name: E2E & Visual

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Phase 78 Theme B — gate these (fat) runners on what changed.
  changes:
    uses: ./.github/workflows/affected.yml

  e2e:
    needs: changes
    # Playwright flows + visual regression only matter when the web app or its
    # upstream (ui/shared/shell) changed.
    if: needs.changes.outputs.webVisual == 'true'
    runs-on: ubuntu-latest
    # `continue-on-error` used to sit here, on the *job*. That made GitHub record
    # the job as `failure` while reporting the whole workflow run as `success` —
    # so `e2e` failed on every single `main` run for weeks behind a green badge,
    # and nobody could see it. It also meant the failing flow step halted the job
    # before the visual step, which therefore never ran at all.
    #
    # It now sits on the visual step alone (below): a screenshot problem still
    # can't block a merge, but a flow regression can. `e2e-gate` surfaces the
    # result as a check that is safe to require.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/web

      # web dependsOn shared + shell + ui, and the steps below invoke Playwright
      # directly, so nothing else will build them (the moon tasks' `^:build` dep
      # is what used to cover this).
      - name: Build upstream packages (web's deps)
        run: moon run shared:build ui:build shell:build

      # `web:e2e` and `web:screenshots` are `runInCI: false` (kept out of the fast
      # `moon ci` gate), which also makes moon refuse to run them via `moon run` in
      # a CI environment — it reports "No tasks found" and exits 1, which is exactly
      # what this job did on every run. Invoke Playwright directly to sidestep the
      # filter, mirroring what the `coverage` job below already does for vitest.
      # The commands mirror the `e2e` / `screenshots` tasks in packages/web/moon.yml.
      - name: Run e2e flow tests
        run: pnpm exec playwright test --project=chromium
        working-directory: packages/web
        env:
          CI: 'true'

      # Capture-only (the `toHaveScreenshot` baseline assertions are gone — see
      # `e2e/screenshots/pages.shots.ts`). `if: always()` so a red flow step
      # doesn't skip it the way it did for the whole life of this job, and
      # `continue-on-error` so a capture problem stays off the merge path.
      - name: Capture screenshots (pages + stories)
        if: always()
        continue-on-error: true
        run: pnpm exec playwright test --project=screenshots --project=stories
        working-directory: packages/web
        env:
          CI: 'true'

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_id }}
          path: |
            packages/web/e2e/__shots__/
            packages/web/e2e/__screenshots__/
            packages/web/playwright-report/
          retention-days: 14

      - name: Upload diff artifacts on visual failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs-${{ github.run_id }}
          path: packages/web/test-results/
          retention-days: 7

  # Mirrors `ci-gate` (ci.yml): passes when `e2e` succeeded OR was skipped
  # (nothing web-visual changed), fails on a real failure/cancel. Point branch
  # protection at THIS job, not `e2e` — a gated skip must not wedge a merge.
  #
  # Without an aggregator there was nothing to require: the job-level
  # `continue-on-error` reported the *run* as green while the job was red, so a
  # permanently-broken suite looked healthy from the outside.
  e2e-gate:
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate e2e result
        run: |
          changes_res="${{ needs.changes.result }}"
          e2e_res="${{ needs.e2e.result }}"
          echo "changes: $changes_res · e2e: $e2e_res"
          if [ "$changes_res" != "success" ]; then
            echo "::error::affected-detection did not succeed ($changes_res)"
            exit 1
          fi
          if [ "$e2e_res" = "success" ] || [ "$e2e_res" = "skipped" ]; then
            echo "e2e gate passed (e2e: $e2e_res)."
            exit 0
          fi
          echo "::error::e2e gate failed (e2e: $e2e_res)"
          exit 1

  coverage:
    needs: changes
    # Coverage targets gateway + web; run when either (or their deps) changed.
    if: needs.changes.outputs.webVisual == 'true' || needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install Playwright chromium (needed for Storybook browser tests)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build upstream packages (coverage runs vitest directly — build web's deps too)
        run: moon run shared:build ui:build shell:build

      # The `test-coverage` moon tasks are `runInCI: false` (kept out of the fast
      # `moon ci` gate), which also makes moon refuse to run them via `moon run` in
      # a CI environment ("No tasks found"). This dedicated job runs vitest directly
      # to sidestep that filter while keeping coverage off the critical path. The
      # commands mirror the `test-coverage` tasks in each package's moon.yml.
      - name: Gateway coverage
        run: pnpm --filter @midnite/gateway exec vitest run --coverage

      - name: Web coverage
        run: pnpm --filter @midnite/web exec vitest run --coverage --project=unit

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: |
            packages/gateway/coverage/
            packages/web/coverage/
          retention-days: 14
